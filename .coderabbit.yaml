language: en-US
enable_free_tier: true
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!**/package-lock.json"
    - "!**/bun.lock"
    - "!**/pnpm-lock.yaml"
    - "!**/yarn.lock"
    - "!**/dist/**"
    - "!**/*.min.js"
chat:
  auto_reply: true
