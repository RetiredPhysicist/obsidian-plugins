name: Labeler

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: labeler-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/labeler@v5
        with:
          sync-labels: false
