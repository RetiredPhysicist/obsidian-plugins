# Obsidian plugins: System One Auto Move and Auto Tag.
#
# Each plugin is its own npm package with its own manifest.json, so releases and
# installs stay independent even though the source lives together here.
name: obsidian-plugins

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Two plugins, one matrix: a change to one must not block the other, and the
  # runner spin-up is the expensive part.
  plugins:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        plugin: [auto-move, auto-tag]
    steps:
      - uses: useblacksmith/checkout@v1

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: packages/${{ matrix.plugin }}/package-lock.json

      - name: Install
        working-directory: packages/${{ matrix.plugin }}
        run: npm ci --no-audit --no-fund

      - name: Typecheck and build
        working-directory: packages/${{ matrix.plugin }}
        run: npm run build

      - name: Unit tests
        working-directory: packages/${{ matrix.plugin }}
        run: node test/run-tests.mjs

      # A build that renames or adds an output leaves the tracked files alone,
      # so `git diff` alone would pass on a stale committed bundle.
      - name: The build leaves the working tree clean
        working-directory: packages/${{ matrix.plugin }}
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all -- .)" ]; then
            git status --porcelain --untracked-files=all -- .
            echo "rebuild and commit the bundle"
            exit 1
          fi

      - name: Manifest and package agree on the version
        working-directory: packages/${{ matrix.plugin }}
        run: |
          node <<'JS'
          const fs = require("fs");
          const manifest = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const versions = JSON.parse(fs.readFileSync("versions.json", "utf8"));
          const problems = [];
          for (const key of ["id", "name", "version", "minAppVersion", "description", "author"])
            if (!manifest[key]) problems.push(`manifest.json has no ${key}`);
          if (manifest.version !== pkg.version)
            problems.push(`manifest version ${manifest.version} != package version ${pkg.version}`);
          if (versions[manifest.version] !== manifest.minAppVersion)
            problems.push(`versions.json[${manifest.version}] != minAppVersion ${manifest.minAppVersion}`);
          if (problems.length) { console.error(problems.join("\n")); process.exit(1); }
          console.log("manifest ok:", manifest.id, manifest.version);
          JS

      - name: The bundle ships no source map
        working-directory: packages/${{ matrix.plugin }}
        run: |
          if grep -q "sourceMappingURL" main.js; then
            echo "main.js carries a source map; production builds must not"
            exit 1
          fi
