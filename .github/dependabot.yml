# Dependabot: weekly grouped updates. Patch/minor/security auto-merged via workflow.
version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/packages/auto-move"
      - "/packages/auto-tag"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      npm-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"